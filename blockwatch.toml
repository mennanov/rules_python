same-as = 'gazelle/MODULE.bazel:gazelle-version'

[[block]]
target = 'gazelle/WORKSPACE'
target-pattern = '(?s)(?P<value>"https://mirror\.bazel\.build/github\.com/bazelbuild/bazel-gazelle/[^"]+",\s+"https://github\.com/bazelbuild/bazel-gazelle/[^"]+",)'
