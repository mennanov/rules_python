name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.14
          args: check --extend-exclude testdata
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.14
          args: format --check --exclude testdata

  blockwatch:
    name: blockwatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download blockwatch
        id: blockwatch
        uses: ./.github/actions/download-tool
        with:
          name: blockwatch
          archive-member: blockwatch-x86_64-unknown-linux-gnu/blockwatch
          urls: |
            https://github.com/mennanov/blockwatch/releases/download/v0.18.0/blockwatch-x86_64-unknown-linux-gnu.tar.xz
          sha256: e789d0b0fef20fead0ad05cb39e924fd7d9950205d880a2940329950bf1b4a57
      - name: Check blockwatch
        if: github.event_name != 'pull_request'
        env:
          BLOCKWATCH_BIN: ${{ steps.blockwatch.outputs.path }}
        run: >-
          "$BLOCKWATCH_BIN"
      - name: Check blockwatch diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BLOCKWATCH_BIN: ${{ steps.blockwatch.outputs.path }}
        run: >-
          git diff --patch "${BASE_SHA}...${HEAD_SHA}" | "$BLOCKWATCH_BIN" --diff

  build_release_artifacts:
    name: Build release artifacts
    uses: ./.github/workflows/release_build_artifacts.yaml
    secrets: inherit
