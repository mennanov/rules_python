# See CONTRIBUTING.md for instructions.
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use the ref you want to point at
    hooks:
      - id: check-merge-conflict
  - repo: https://github.com/mennanov/blockwatch
    # <block name="blockwatch-rev" same-as=".github/workflows/ci.yaml:blockwatch-url" same-as-pattern="rev: v(?P<value>\S+)">
    rev: v0.18.0
    # </block>
    hooks:
      - id: blockwatch
  - repo: https://github.com/keith/pre-commit-buildifier
    # <block name="buildifier-rev" same-as=".bazelci/presubmit.yml:buildifier-version" same-as-pattern="rev: (?P<value>\S+)">
    rev: 8.2.1
    # </block>
    hooks:
      - id: buildifier
        args: &args
          # <block name="buildifier-args" same-as=".bazelci/presubmit.yml:buildifier-warnings" same-as-pattern="--warnings=(?P<value>\w+)">
          - --warnings=all
          # </block>
      - id: buildifier-lint
        args: *args
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # <block name="ruff-rev" same-as=".github/workflows/ci.yaml:ruff-check-version,.github/workflows/ci.yaml:ruff-format-version" same-as-pattern="rev: v(?P<value>\S+)">
    rev: v0.15.14
    # </block>
    hooks:
      - id: ruff-check
        args: [--fix]
        # <block name="ruff-check-exclude-hook" same-as=".github/workflows/ci.yaml:ruff-check-exclude" same-as-pattern="exclude: (?P<value>\S+)">
        exclude: testdata
        # </block>
      - id: ruff-format
        # <block name="ruff-format-exclude-hook" same-as=".github/workflows/ci.yaml:ruff-format-exclude" same-as-pattern="exclude: (?P<value>\S+)">
        exclude: testdata
        # </block>
  - repo: local
    hooks:
      - id: update-deleted-packages
        name: Update deleted packages
        language: system
        # 7.x is necessary until https://github.com/bazel-contrib/rules_bazel_integration_test/pull/414
        # is merged and released
        entry: ./tools/update_deleted_packages.sh
        files: ^((examples|tests)/.*/(MODULE.bazel|WORKSPACE|WORKSPACE.bzlmod|BUILD.bazel)|.bazelrc)$
        pass_filenames: false
      - id: sort-runtimes-manifest
        name: Sort runtimes manifest
        language: system
        entry: ./python/private/tools/sort_manifest.py
        files: ^python/private/runtimes_manifest\.bzl$
      - id: sync-downloader-configs
        name: Sync downloader configs
        language: system
        entry: ./dev/sync_downloader_configs.py
        files: downloader_config\.cfg$
        pass_filenames: false
      - id: gazelle
        name: Run Gazelle
        language: system
        entry: bazel run //dev/gazelle
        files: (\.bzl|\.bazel|BUILD|WORKSPACE(\.bzlmod)?)$
        pass_filenames: false
